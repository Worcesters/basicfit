# fly.toml - Configuration Fly.io pour BasicFit v2
# Documentation: https://fly.io/docs/reference/configuration/

app = "basicfit-v2"
primary_region = "cdg"  # Paris (plus proche de la France)

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "basicfit_project.settings.flyio"
  PORT = "8000"

[[services]]
  internal_port = 8000
  processes = ["web"]
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "60s"
    restart_limit = 0
    timeout = "10s"

# [[services.http_checks]]
#   grace_period = "30s"
#   interval = "60s"
#   method = "get"
#   path = "/"
#   protocol = "http"
#   restart_limit = 0
#   timeout = "10s"

[processes]
  web = "bash -c 'python manage.py migrate && python manage.py collectstatic --noinput && gunicorn basicfit_project.wsgi:application --bind 0.0.0.0:8000 --workers 1'"

# Configuration des machines
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Variables d'environnement sécurisées (à définir via flyctl secrets)
# flyctl secrets set SECRET_KEY=your-secret-key
# flyctl secrets set DATABASE_URL=postgres://...
# flyctl secrets set CLOUDINARY_CLOUD_NAME=your-cloud-name
# flyctl secrets set CLOUDINARY_API_KEY=your-api-key
# flyctl secrets set CLOUDINARY_API_SECRET=your-api-secret

