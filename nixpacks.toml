[providers]
python = "3.11"

[phases.build]
cmds = [
  "cd backend",
  "pip install -r requirements.txt", 
  "python manage.py collectstatic --noinput --settings=basicfit_project.settings.production"
]

[phases.start]
cmd = "cd backend && python manage.py migrate --settings=basicfit_project.settings.production && python manage.py runserver 0.0.0.0:$PORT --settings=basicfit_project.settings.production"

[variables]
DJANGO_SETTINGS_MODULE = "basicfit_project.settings.production"
DEBUG = "False"